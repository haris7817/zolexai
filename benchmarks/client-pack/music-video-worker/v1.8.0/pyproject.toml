[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zolexai-music-video-worker"
version = "1.8.0"
description = "Resumable, frame-exact cinematic music-video orchestrator for LTX audio-to-video pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
lyrics = ["faster-whisper>=1.1,<2"]
reference-links = ["yt-dlp>=2025.1,<2028"]
reference-ai = [
  "transformers>=4.51,<6",
  "accelerate>=1,<2",
  "qwen-vl-utils>=0.0.8,<1",
]
models = [
  "huggingface-hub>=0.34,<2",
  "hf-xet>=1.1,<2",
]
dev = ["pytest>=8,<10"]

[project.scripts]
zolex-music-video = "zolex_music_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
