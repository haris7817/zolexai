# ZolexAI — edge configuration.
#
# Reference config for a single-domain production deployment: the frontend and
# the API behind one origin, which is why `NEXT_PUBLIC_API_URL` can be empty
# (same-origin) in production.
#
# Two rules here are load-bearing rather than cosmetic:
#
#   1. `/api/v1/internal/` is refused at the edge. Those endpoints coordinate
#      workers and must be reachable only on the private network. The service
#      token already guards them; this makes a leaked token insufficient on its
#      own, and means a misconfigured deployment fails closed.
#
#   2. Buffering is off for SSE. nginx buffers proxied responses by default,
#      which would hold every progress event until the connection closed —
#      turning a live stream into one very slow response.

upstream zolexai_web {
    server web:3000;
    keepalive 32;
}

upstream zolexai_api {
    # Add a line per instance. The API is stateless, so no sticky sessions and
    # no session affinity are needed — any instance can serve any request,
    # including an SSE stream for a job another instance's worker is running.
    server api:8000;
    keepalive 32;
}

# Fair-use backstop at the edge, in front of the application's own per-user
# limits. This one is per-IP and exists to absorb floods before they reach
# Python at all.
limit_req_zone $binary_remote_addr zone=zolexai_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Uploads go BROWSER → OBJECT STORAGE directly (ADR 0006), so nothing large
    # should ever transit this proxy. A small ceiling makes a regression that
    # reintroduces proxied uploads fail loudly instead of silently working and
    # capping throughput.
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Internal worker API — never public ───────────────────────────────
    location /api/v1/internal/ {
        return 404;   # 404 rather than 403: do not confirm the path exists
    }

    # ── SSE ──────────────────────────────────────────────────────────────
    location ~ ^/api/v1/generations/[^/]+/events$ {
        proxy_pass http://zolexai_api;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # A generation can be quiet for minutes. The application sends a
        # keepalive comment every 15s, but the read timeout must still exceed
        # the longest plausible silence.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Lets a reconnecting EventSource resume exactly where it left off.
        proxy_set_header Last-Event-ID $http_last_event_id;
    }

    # ── Public API ───────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=zolexai_api burst=40 nodelay;
        proxy_pass http://zolexai_api;
        proxy_read_timeout 60s;
    }

    # ── Frontend ─────────────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://zolexai_web;
        # Content-hashed filenames — safe to cache permanently.
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://zolexai_web;
        proxy_read_timeout 60s;
    }
}
