[project]
name = "zolexai-worker"
version = "0.1.0"
description = "ZolexAI generation worker"
requires-python = ">=3.11,<3.14"

# Deliberately minimal, and deliberately NOT sharing the API's dependency set.
#
# The worker has no database driver, no SQLAlchemy and no FastAPI: it reaches
# the platform only through the internal HTTP API and object storage. That is
# what makes it independently deployable — and it means a GPU node in M2 does
# not need PostgreSQL credentials or network access to the database at all.
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "redis>=5.2,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
