id: image-to-video
version: "1"
name: Image to Video
category: video
output_type: video

description: Animate a still image into natural motion
short_description: Animate any image
marketing_description: Animate any still image into smooth, natural motion.

prompt:
  required: true
  placeholder: "Describe how the image should move…"
  # See text-to-video.yaml — effectively unlimited, capped only because an
  # unbounded request body is a denial-of-service surface.
  max_length: 20000

inputs:
  - role: source_image
    kind: image
    required: true
    label: INPUT IMAGE
    drop_hint: an image
    accept: ["image/jpeg", "image/png", "image/webp"]
    max_size_mb: 25

duration_mode: fixed
# 5-30s. The ladder lost 60s on 28 Aug 2026 when this workflow settled on one
# engine: 60s exists in that engine's lattice but is proven only on its
# video-reference path, and offering a length whose render is unmeasured is
# how a customer waits an hour for a refusal. Lengths the lattice cannot hit
# exactly (20s) render the next preset up and are trimmed to the promise.
supported_durations: ["5s", "10s", "15s", "20s", "30s"]
supported_aspect_ratios: ["16:9", "9:16", "1:1"]
# NO quality toggle (client decision, 28 Aug 2026), and the engine that stays
# is the one Best used to reach.
#
# The first cut of this removed the toggle and left the workflow on the other
# engine, which was backwards. That engine's image path is the DISTILLED
# entry point: no CFG, no spatio-temporal guidance, no negative prompt — none
# of the machinery that makes a render follow its prompt. The client filed
# the result within the hour: an image, a prompt reading "he points the gun
# at the camera and looks gangsta", and a video where "the image is just
# moving". 360 frames in 48 seconds, which is the giveaway — adherence costs
# time and none was spent.
#
# They asked for the CHOICE to go away, not for the engine that was making
# the good videos. So Image to Video is the engine whose I2V graph makes the
# customer's picture the literal first frame and animates the prompt from
# there, at every length, with nothing to select.
supported_quality_levels: []

settings:
  quality: false
  # Sound on/off — see text-to-video.yaml.
  sound: true
  motion_strength: false
  prompt_adherence: false
  seed: true
  # NO prompt-mode toggle (client decision, 28 Aug 2026). Director mode plans
  # dialogue and timing before generating, which is a different product from
  # "animate my photo" and was a second choice to make on a screen whose whole
  # promise is that there is nothing to decide. Standard is what this workflow
  # is, and the Director machinery stays available to Text to Video.
  prompt_modes: false

capabilities:
  download: true
  extend: true
  reuse_settings: true
  variation: true

ui:
  icon: image
  thumb: "linear-gradient(140deg, #33430D, #111708)"

execution:
  # PRIVATE — stripped from every public API response.
  runtime: mock

  # The language of any speech the model generates — see text-to-video.yaml
  # for the full note. A customer's `dialogue_language` and a Director plan's
  # own language both win over this.
  spoken_language: english

  # Single-pass ceiling: 30 seconds — same measured reason as
  # text-to-video.yaml (the model does not hold 60s of story in one pass;
  # 30s passes are the measured-clean regime). 60s becomes two chained
  # sections; every shorter duration is unchanged. The uploaded still opens
  # pass one and rides later passes as the identity reference, exactly as the
  # chain has always conditioned I2V.
  max_segment_seconds: 30

  # Deterministic prompt structuring — see text-to-video.yaml for the full
  # note and apps/worker/worker/longform/enhance.py for the rules.
  prompt_structuring: true

  # ── Revised continuity block + Director camera controls (OFF) ──
  #
  # prompt_structuring_v2: true
  # director_camera_continuity: true
  # director_camera_from_idea: true
  #
  # Same three switches and same reasoning as text-to-video.yaml (see the
  # full notes there). All three change only prompt/caption text, are off by
  # default, and are byte-identical to shipped behaviour while off.

  # ── Guided quality tier (OFF — a product/pricing decision) ──
  #
  # generation_engine: guided
  # guided_pass_seconds: 5.0
  #
  # Same switch and same measured costs as text-to-video.yaml (see the full
  # note there): guided two-stage pipeline, CFG + STG + negative prompt,
  # ~4.3x the render time, passes capped at the one measured 121-frame
  # landing. I2V conditioning (`--image` stills, including the low-strength
  # identity reference on later passes) rides along unchanged — the guided
  # pipeline takes the same conditioning flags the distilled one does.

  # M1 runs the mock runtime, which emits a placeholder image rather than
  # rendered media. `output_type` above stays the product truth; these two lines
  # describe what the current runtime actually writes, and the API signs the
  # worker's upload for exactly this type. Remove both when M2 wires up a real
  # provider.
  output_content_type: image/png
  output_kind: image
