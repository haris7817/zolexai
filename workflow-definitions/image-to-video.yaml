id: image-to-video
version: "1"
name: First/Last Frame Video
category: video
output_type: video

description: Animate a still image, and optionally steer it to a final frame
short_description: Animate any image
marketing_description: Turn a still into smooth, natural motion — and choose the frame it ends on.

prompt:
  required: true
  placeholder: "Describe how the image should move…"
  # See text-to-video.yaml — effectively unlimited, capped only because an
  # unbounded request body is a denial-of-service surface.
  max_length: 20000

# The client's First/Last Frame workflow (final milestone, 5 Sep 2026): the
# first frame is the picture the video starts on and is required; the last
# frame is optional and, when given, the picture the video ends on. The id
# stays `image-to-video` so history, Extend and every saved link keep
# working — only the product name changed.
inputs:
  - role: source_image
    kind: image
    required: true
    label: FIRST FRAME
    drop_hint: the first frame
    help: The video starts on this picture.
    accept: ["image/jpeg", "image/png", "image/webp"]
    max_size_mb: 25
  - role: last_frame
    kind: image
    required: false
    label: LAST FRAME
    drop_hint: an optional last frame
    help: Optional. The video ends on this picture.
    accept: ["image/jpeg", "image/png", "image/webp"]
    max_size_mb: 25

duration_mode: fixed
# The client's ladder (5 Sep 2026): four lengths, each one generation pass.
# 20s and 60s left the ladder; longer videos continue a finished one with
# Extend Video.
supported_durations: ["5s", "10s", "15s", "30s"]
# The workflow resizes the stills to the selected canvas (the ZIP's own
# behaviour, kept by client decision); the canvas selector offers these three
# of the product's ratios.
supported_aspect_ratios: ["16:9", "9:16", "1:1"]
# NO quality toggle (client decision, 28 Aug 2026, reaffirmed 5 Sep): one
# workflow, one engine, nothing to select.
supported_quality_levels: []

settings:
  quality: false
  # Sound on/off — the workflow delivers an audio track; a customer may want
  # a silent file.
  sound: true
  motion_strength: false
  prompt_adherence: false
  seed: true
  # NO prompt-mode toggle (client decision, 28 Aug 2026). Standard is what
  # this workflow is; the Director machinery stays in the repository, unrouted.
  prompt_modes: false

capabilities:
  download: true
  extend: true
  reuse_settings: true
  variation: true

ui:
  icon: image
  thumb: "linear-gradient(140deg, #33430D, #111708)"

execution:
  # PRIVATE — stripped from every public API response.
  #
  # The committed value is the mock; the deployment overlay
  # (deploy/vps-local.sh) writes the real runtime: `ltx` (the CLI pipelines,
  # production until the GPU validates the pack) or `ltx_comfy` (the client's
  # First/Last Frame graph, the target). One line, no code change.
  runtime: mock

  # The language of any speech the model generates — see text-to-video.yaml.
  spoken_language: english

  # Single-pass ceiling: 30 seconds — the client's ladder and the pack's own
  # slider maximum. Every offered length is one pass.
  max_segment_seconds: 30

  # Deterministic prompt structuring — see text-to-video.yaml.
  prompt_structuring: true

  # ── Optional, per deployment ──────────────────────────────────────────
  #
  # negative_prompt: "…"   — overrides the house negative prompt on the
  #                          ltx_comfy runtime (default: the ZIP graph's own).
  # canvas_from_source_image: true — CLI runtime only: the picture decides
  #                          the shape (the ltx_comfy runtime resizes to the
  #                          selected canvas, as the ZIP graph does).

  # M1 runs the mock runtime, which emits a placeholder image rather than
  # rendered media. `output_type` above stays the product truth; these two lines
  # describe what the current runtime actually writes, and the API signs the
  # worker's upload for exactly this type. Remove both when M2 wires up a real
  # provider.
  output_content_type: image/png
  output_kind: image
