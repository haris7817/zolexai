id: music-video
version: "1"
name: Music Video
category: audio
output_type: video

description: Pair audio with visual direction
short_description: Audio meets visuals
marketing_description: Pair audio with visual direction to produce full music videos.

prompt:
  required: true
  # The placeholder is doing real work here, not decoration. Two 60-second
  # renders of the same track through the same pipeline on 27 Aug 2026 differ
  # only in their prompt, and they are not close: the one naming its singer
  # ("a woman with long curly dark hair in an orange satin shirt, at a vintage
  # microphone") held one person, one wardrobe and one room for the full
  # minute, while "a cinematic music video at sunset" drifted from a man in a
  # purple suit on a rooftop to a woman in a pink one, filmed from far enough
  # away that no face was ever legible.
  #
  # Since the client's music-video worker (8 Sep 2026) the performers can be
  # supplied as pictures below, and a direction that says "according to the
  # lyrics" has the song transcribed and every scene written from its words.
  placeholder: "What kind of video, and where — e.g. make me a cinematic video
    according to the lyrics of the song, on a night rooftop over the city"
  # See text-to-video.yaml — effectively unlimited, capped only because an
  # unbounded request body is a denial-of-service surface.
  max_length: 20000

inputs:
  - role: source_audio
    kind: audio
    required: true
    label: AUDIO
    drop_hint: an audio track
    # The length limit belongs HERE, before the upload, not in the refusal
    # afterwards. The video is generated in sections across the whole track, so
    # length is the single thing that decides how much work the job is — and
    # the size cap alone permits an hour of audio, which is a job that cannot
    # finish. Worker-side the ceiling is the music-video worker's own 300 s.
    help: Up to 5 minutes. The video is generated to match your whole track.
    accept: ["audio/mpeg", "audio/wav", "audio/x-wav", "audio/mp4", "audio/ogg"]
    # 200 matches the platform's audio ceiling (see MAX_SIZE_BYTES in
    # apps/api/app/services/storage.py). The old 64 was sized for MP3s and
    # silently refused honest lossless uploads — a five-minute stereo WAV is
    # 50-85 MB. Bytes were never the work bound anyway; the 5-minute LENGTH
    # rule above is, and it is enforced before any compute is spent.
    max_size_mb: 200

  # ── The band (client's music-video worker v1.8.0, 8 Sep 2026) ──────────
  #
  # Up to five performers, one picture each. The slot number pairs the
  # picture with its role and description in the `performers` parameter
  # (`settings.performers` below). A clear front-facing photo per member is
  # what the worker's own guidance asks for; a member may also be described
  # without a picture, and with no performers at all the worker creates a
  # fictional adult lead. Solo and duet coverage, rotating solos and
  # full-band wides follow from how many are given.
  - role: performer_1
    kind: image
    required: false
    label: PERFORMER 1
    drop_hint: a photo of the first performer
    help: Optional. One clear front-facing photo per band member, up to five.
    max_size_mb: 50
  - role: performer_2
    kind: image
    required: false
    label: PERFORMER 2
    drop_hint: a photo of the second performer
    max_size_mb: 50
  - role: performer_3
    kind: image
    required: false
    label: PERFORMER 3
    drop_hint: a photo of the third performer
    max_size_mb: 50
  - role: performer_4
    kind: image
    required: false
    label: PERFORMER 4
    drop_hint: a photo of the fourth performer
    max_size_mb: 50
  - role: performer_5
    kind: image
    required: false
    label: PERFORMER 5
    drop_hint: a photo of the fifth performer
    max_size_mb: 50

# Duration is automatic (CR-007): the final video matches the full uploaded
# track — a 30-second song yields a 30-second video, a 4-minute song a 4-minute
# video. Long tracks are produced in sections and assembled by the worker.
duration_mode: source
supported_durations: []
supported_aspect_ratios: ["16:9", "9:16", "1:1"]
supported_quality_levels: []

settings:
  quality: false
  motion_strength: false
  prompt_adherence: false
  seed: false
  # The song's own words, pasted (plain lines, LRC or SRT). Optional: a
  # direction that asks to follow the lyrics has them transcribed from the
  # track when none are pasted; pasted lyrics always win, and the language
  # choice tells the transcriber what to listen for.
  lyrics: true
  # Role and description beside each performer picture — `performers` in the
  # request, validated against the `performer_N` roles above.
  performers: true

capabilities:
  download: true
  # The output is cut to the supplied track, so extending it past the audio is
  # not meaningful.
  extend: false
  reuse_settings: true
  variation: true

ui:
  icon: clapper
  thumb: "linear-gradient(140deg, #1C240C, #182008)"

execution:
  # PRIVATE — stripped from every public API response.
  runtime: mock

  # Deterministic prompt structuring — see text-to-video.yaml for the full
  # note and apps/worker/worker/longform/enhance.py for the rules. Read by
  # the CLI runtime only; the music-video worker writes its own prompts.
  prompt_structuring: true

  # The longest job the product has. A four-minute track is fifty-odd shots
  # plus anchors, assembly and a 4K finish, and the default 30-minute budget
  # would kill it long before the end — after the compute had been spent.
  timeout_seconds: 7200

  # Visual cuts are pulled back onto a rise in the track's energy where one is
  # available, so a section change lands on a hit rather than mid-phrase.
  # CLI runtime only; the music-video worker cuts on its own transient
  # analysis and on lyric boundaries.
  align_cuts_to_audio: true

  # ── Which engine ──────────────────────────────────────────────────────────
  #
  # The deployment overlay (deploy/vps-local.sh) writes the runtime:
  #
  #   ltx           the CLI adapter's own music video — prompt-only picture
  #                 in 20 s sections, the song laid over the result, or the
  #                 audio tier with `audio_conditioning: true`. The rollback.
  #   music_video   the client's music-video worker (v1.8.0): shots of 2–5 s
  #                 cut on the music and the lyrics, an anchor still per shot
  #                 with the performers' real faces, an audio-conditioned LTX
  #                 pass per shot, one 4K finish. Keys it reads:
  #
  #                   inference_steps      stage-1 steps per shot (node default 24)
  #                   shot_target_seconds / shot_min_seconds / shot_max_seconds
  #                   lyric_mode           automatic | always | off
  #                   render_backend       command | ltx | mock
  #                   anchor_backend       command | reference | mock
  #
  # See docs/internal/music-video-worker.md.

  # M1 runs the mock runtime, which emits a placeholder image rather than
  # rendered media. `output_type` above stays the product truth; these two lines
  # describe what the current runtime actually writes, and the API signs the
  # worker's upload for exactly this type. Remove both when M2 wires up a real
  # provider.
  output_content_type: image/png
  output_kind: image
