# ZolexAI workflow definition — PUBLIC METADATA.
#
# These files are the single source of truth for what ZolexAI offers. The API
# validates them at startup and serves them at GET /api/v1/workflows; the
# frontend builds every tool surface from them; the worker dispatches on them.
#
# Anything provider-, model- or hardware-specific belongs under `execution:`,
# which is stripped from every public response. See docs/decisions/0002.
id: text-to-video-hd
version: "1"
name: Text to Video HD
category: video
output_type: video

description: Describe a scene and generate it in full 1080p
short_description: From prompt to motion, at 1080p
marketing_description: >-
  Describe a scene and watch it come to life in full 1920x1080, with sound.
  Sharper and more detailed than the standard tool, and it takes longer to
  make.

prompt:
  required: true
  placeholder: "Describe the video you want to create…"
  max_length: 20000

# No uploaded assets — the prompt is the only input.
inputs: []

duration_mode: fixed
# The two lengths benchmarked on the RTX PRO 6000 (7 Sep 2026): 8 s renders in
# about 2 minutes, 15 s in about 5. Thirty seconds also works and is not
# hardware limited, but it takes 17.5 minutes and holds a node that serves one
# job at a time for as long as eight 8 s renders, so it is deliberately not
# offered yet. Adding it is this list plus `ltx_hd_max_seconds`.
supported_durations: ["8s", "15s"]
# The graph has no aspect selector: it generates 1920x1088 and its closing
# ImageScale delivers 1920x1080. An orientation is those two widgets turned on
# their side (8 Sep 2026) — 9:16 generates 1088x1920 and delivers 1080x1920,
# 1:1 generates 1088x1088 and delivers 1080x1080 — so all three are real
# renders at the model's stride, not a crop of a landscape frame.
supported_aspect_ratios: ["16:9", "9:16", "1:1"]
supported_quality_levels: []

settings:
  quality: false
  # The graph writes its own soundtrack; a customer may want a silent file.
  sound: true
  motion_strength: false
  prompt_adherence: false
  seed: true
  prompt_modes: false

  # Auto Dialogue (client request, 8 Sep 2026). Off unless the customer
  # turns it on: the worker writes spoken lines into a prompt that has none,
  # and a prompt that already carries quoted words or asks for silence is
  # left exactly as written. Turning it on is a promise the worker keeps by
  # FAILING a job whose lines could not be written, rather than delivering a
  # silent video that looks like a success. See
  # apps/worker/worker/dialogue/__init__.py.
  auto_dialogue: true

capabilities:
  download: true
  # Extend continues a clip on the First/Last Frame graph, which renders a
  # different canvas. Off until that pairing is measured.
  extend: false
  reuse_settings: true
  variation: true

ui:
  icon: sparkles
  thumb: "linear-gradient(140deg, #0C2632, #08151C)"

# Hidden (7 Sep 2026): the client asked for their FAST 1080 graph to be Text
# to Video itself, not a second tool beside it. The definition stays so the
# adapter, its tests and the deploy overlay keep a stable id — and so the
# tool can be shown again by flipping this line.
hidden: true

execution:
  # PRIVATE — stripped from every public API response.
  #
  # The committed value is the mock; the deployment overlay
  # (deploy/vps-local.sh) writes `ltx_hd`, the adapter that runs the client's
  # own FAST 1080 graph. Rolling this tool back is this one line.
  runtime: mock

  # 15 s measured at 306 s; the budget covers the ceiling with wide margin,
  # including the model load on a cold node.
  timeout_seconds: 1800

  # ── Optional, per deployment ──────────────────────────────────────────
  #
  # negative_prompt: "…"  — replaces the negative prompt the CLIENT wrote into
  #                         the graph. Unset keeps theirs, which is the
  #                         faithful default: the graph ships with a long,
  #                         carefully written negative and nothing here
  #                         improves on it.

  # ltx25_guidelines: true  — rewrite the customer's prompt to the client's
  #                         LTX 2.5 guideline pack before rendering (one
  #                         language-model call; form chosen from the text,
  #                         result validated, every failure falls back to the
  #                         prompt as written). Default off: it wants a GPU
  #                         A/B against what it replaces. See
  #                         apps/worker/worker/prompt/ltx25/.
  # ltx25_form: single_shot | multi_shot | screenplay — pin the form instead
  #                         of reading it from the prompt.
