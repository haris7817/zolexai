# ZolexAI workflow definition — PUBLIC METADATA.
#
# These files are the single source of truth for what ZolexAI offers. The API
# validates them at startup and serves them at GET /api/v1/workflows; the
# frontend builds every tool surface from them; the worker dispatches on them.
#
# Anything provider-, model- or hardware-specific belongs under `execution:`,
# which is stripped from every public response. See docs/decisions/0002.
id: text-to-video
version: "1"
name: Text to Video
category: video
output_type: video

description: Describe a scene and generate cinematic video
short_description: From prompt to motion
marketing_description: Describe a scene and watch it come to life as cinematic video.

prompt:
  required: true
  placeholder: "Describe the video you want to create…"
  # Effectively unlimited (client request, 14 Aug 2026): 20 000 characters is
  # ~3 000 words and is the ceiling the API schema allows. Nobody writing a
  # prompt reaches it. It is not literally removed because the value bounds a
  # request body, and an unbounded one is a denial-of-service surface.
  max_length: 20000

# No uploaded assets — the prompt is the only input.
inputs: []

duration_mode: fixed
# The client's ladder (final milestone, 5 Sep 2026): four lengths, each one
# generation pass. 20s and 60s left the ladder the same day — longer videos
# are made by continuing a finished one with Extend Video, never by a single
# pass, and the product says so rather than pretending otherwise.
supported_durations: ["5s", "10s", "15s", "30s"]
# 4:5 left with the engine change: the canvas selector the new workflow uses
# offers 1:1, 9:16 and 16:9 among the product's ratios and has no 4:5.
supported_aspect_ratios: ["16:9", "9:16", "1:1"]
# No quality toggle (client decision, 5 Sep 2026): the Best and Standard
# options are gone, and with them the only route to the engine they selected.
# One workflow, one engine, nothing to choose.
supported_quality_levels: []

settings:
  quality: false
  # A sound on/off choice: the workflow delivers an audio track, and a
  # customer may want a silent file.
  sound: true
  motion_strength: false
  prompt_adherence: false
  seed: true
  # No Standard / Idea (Director) toggle (client decision, 5 Sep 2026). The
  # Director planner stays in the repository, unrouted; nothing here can
  # reach it, and the API rejects `prompt_mode` on this workflow.
  prompt_modes: false

capabilities:
  download: true
  extend: true
  reuse_settings: true
  variation: true

ui:
  icon: sparkles
  thumb: "linear-gradient(140deg, #26320C, #151C08)"

execution:
  # PRIVATE — stripped from every public API response.
  #
  # The committed value is the mock; the deployment overlay
  # (deploy/vps-local.sh) writes the real runtime. Two exist for this
  # workflow: `ltx` (the CLI pipelines, production until the GPU validates
  # the pack) and `ltx_comfy` (the client's own LTX 2.5 graph, the target).
  # Switching between them is one line here and no code change.
  runtime: mock

  # ── The language of generated sound ──────────────────────────────────────
  #
  # Both runtimes write their own audio from the same prompt that draws the
  # picture: there is no separate audio prompt and no language flag. An
  # unstated language is the model choosing one (client, 28 Aug 2026:
  # "everything I hit sound in images comes with a language that is not
  # english"). A customer's own `dialogue_language` still wins; this is what
  # applies when nothing else has an opinion. One of: english, spanish,
  # french, german, russian.
  spoken_language: english

  # Single-pass ceiling: 30 seconds — the client's ladder and the pack's own
  # slider maximum. Every offered length is one pass.
  max_segment_seconds: 30

  # Deterministic prompt structuring (worker-side). The user's text reaches
  # the model verbatim as the first block; the worker appends derived
  # continuity rules. See apps/worker/worker/longform/enhance.py.
  prompt_structuring: true

  # ── Optional, per deployment ──────────────────────────────────────────
  #
  # negative_prompt: "…"   — overrides the house negative prompt on the
  #                          ltx_comfy runtime (default: derived from the
  #                          client's own graph; see comfy/ltx_prompts.py).
  # prompt_structuring_v2: true — the revised continuity block (CLI runtime).

  # M1 runs the mock runtime, which emits a placeholder image rather than
  # rendered media. `output_type` above stays the product truth; these two lines
  # describe what the current runtime actually writes, and the API signs the
  # worker's upload for exactly this type. Remove both when M2 wires up a real
  # provider.
  output_content_type: image/png
  output_kind: image
