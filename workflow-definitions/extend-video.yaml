id: extend-video
version: "1"
name: Extend Video
category: video
output_type: video

description: Continue a generated video seamlessly
short_description: Continue any clip
marketing_description: Continue any generated video seamlessly, as long as you need.

prompt:
  required: true
  placeholder: "Describe what happens next…"
  # See text-to-video.yaml — effectively unlimited, capped only because an
  # unbounded request body is a denial-of-service surface.
  max_length: 20000

inputs:
  - role: source_video
    kind: video
    required: true
    label: SOURCE VIDEO
    drop_hint: a video
    help: Up to 30 minutes. Your video is kept as-is and continued from its final frame.
    accept: ["video/mp4", "video/quicktime", "video/webm"]
    max_size_mb: 512

duration_mode: fixed
# The client's extension ladder (final milestone, 5 Sep 2026): each step is
# ONE continuation pass conditioned on the source's final frame, and any
# result can itself be extended again. That is how long videos are made —
# chained continuation, never a single generation: 30 s + 30 s + 30 s. The
# old long end (60s/2m/5m) left with the engine change; a customer who
# wants two more minutes presses Extend four times.
supported_durations: ["5s", "10s", "15s", "30s"]
supported_aspect_ratios: ["16:9", "9:16"]
supported_quality_levels: []

settings:
  quality: false
  motion_strength: false
  prompt_adherence: false
  seed: false

capabilities:
  download: true
  extend: true
  reuse_settings: true
  variation: false

ui:
  icon: extend
  thumb: "linear-gradient(140deg, #2C3A0B, #141A08)"

execution:
  # PRIVATE — stripped from every public API response.
  #
  # The committed value is the mock; the deployment overlay writes the real
  # runtime: `ltx` (the CLI pipelines, production until the GPU validates the
  # pack) or `ltx_comfy` (the client's First/Last Frame graph driven by the
  # extension engine, apps/worker/worker/longform/continuation.py).
  runtime: mock

  # The language of any speech the model generates — see text-to-video.yaml.
  spoken_language: english

  # Deterministic prompt structuring — see text-to-video.yaml.
  prompt_structuring: true

  # One continuation pass may be up to 30 s; the whole ladder is one pass.
  max_segment_seconds: 30

  # The source is re-encoded once and a continuation rendered; 90 minutes
  # covers a long source plus a 30 s pass with margin.
  timeout_seconds: 7200

  # M1 runs the mock runtime, which emits a placeholder image rather than
  # rendered media. `output_type` above stays the product truth; these two lines
  # describe what the current runtime actually writes, and the API signs the
  # worker's upload for exactly this type. Remove both when M2 wires up a real
  # provider.
  output_content_type: image/png
  output_kind: image
