; supervisord program for the LTX 2.5 ComfyUI runtime — the SECOND ComfyUI
; instance on the GPU node (the H3 one stays frozen and, with ENABLE_H3=false,
; stopped). Install with:
;
;   cp deploy/gpu/zolexai-ltx-comfy.conf /etc/supervisor/conf.d/
;   cp deploy/gpu/zolexai-ltx-comfy.sh   /opt/supervisor-scripts/ && chmod +x /opt/supervisor-scripts/zolexai-ltx-comfy.sh
;   supervisorctl reread && supervisorctl update && supervisorctl status zolexai-ltx-comfy
;
; Same conventions as the worker and music programs (gpu-worker-runbook §37):
; stopasgroup/killasgroup so a stop never orphans a process holding VRAM.
[program:zolexai-ltx-comfy]
command=/opt/supervisor-scripts/zolexai-ltx-comfy.sh
directory=/workspace/ComfyUI-ltx
autostart=true
autorestart=true
startsecs=20
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/zolexai-ltx-comfy.log
stderr_logfile=/tmp/zolexai-ltx-comfy.log
redirect_stderr=true
